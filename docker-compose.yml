name: mediaserver

# ---------------------------------------------------------------------------
# Media Server v2 — locale, acceso a domanda (accendo → scarico → guardo → spengo)
#
# Novità rispetto alla v1:
#  - Struttura a ROOT UNICA (/data) -> import via hardlink invece di copie lente
#  - Rimosso Jackett (ridondante con Prowlarr) e la dashboard statica
#  - Aggiunti Bazarr (sottotitoli) e Homepage (dashboard live)
#  - Rimossa la rete esterna proxy-public: accesso diretto via porte sulla LAN
#  - Versioni pinnate (niente :latest), config via .env
#
# I valori (IP, path, API key) stanno in .env — vedi README.md
# ---------------------------------------------------------------------------

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Europe/Rome}

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11
    container_name: mediaserver-jellyfin
    restart: unless-stopped
    environment:
      <<: *common-env   # PUID/PGID/TZ: l'immagine LSIO gira non-root
    ports:
      - "8096:8096"
    volumes:
      - mediaserver-jellyfin-config:/config
      - mediaserver-jellyfin-cache:/cache
      - ${MEDIA_ROOT}/media:/data/media:ro   # legge solo la libreria, in sola lettura
    # Transcoding hardware VAAPI (Beelink EQR6 — AMD Radeon 660M, RDNA2).
    # Richiede /dev/dri sull'host e RENDER_GID nel .env (getent group render).
    # In Jellyfin: Dashboard > Playback > Hardware acceleration = VAAPI.
    # Su hardware SENZA iGPU passthrough, commenta le 4 righe qui sotto.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?imposta RENDER_GID nel .env — vedi: getent group render}"
    networks:
      - mediaserver-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.2
    container_name: mediaserver-qbittorrent
    restart: unless-stopped
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    ports:
      - "8080:8080"        # WebUI
      - "6881:6881"        # BitTorrent TCP
      - "6881:6881/udp"    # BitTorrent UDP
    volumes:
      - mediaserver-qbittorrent-config:/config
      - ${MEDIA_ROOT}:/data   # root unica: qBittorrent scarica in /data/torrents
    networks:
      - mediaserver-network

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:nightly-version-2.5.1.5460
    container_name: mediaserver-prowlarr
    restart: unless-stopped
    environment:
      <<: *common-env
      DOTNET_SYSTEM_NET_DISABLEIPV6: 1
    ports:
      - "9696:9696"
    volumes:
      - mediaserver-prowlarr-config:/config
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - mediaserver-network

  # Risolve il "Cloudflare challenge" per gli indexer pubblici protetti (es. 1337x).
  # In Prowlarr: Settings > Indexers > Indexer Proxies > FlareSolverr,
  #   Host = http://mediaserver-flaresolverr:8191, poi aggiungi il Tag all'indexer.
  # Se un sito non si sblocca, sostituisci l'immagine con ghcr.io/thephaseless/byparr:latest
  # (drop-in: stessa porta 8191 e stessa configurazione in Prowlarr).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: mediaserver-flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Rome}
      LOG_LEVEL: info
    networks:
      - mediaserver-network

  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    container_name: mediaserver-radarr
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "7878:7878"
    volumes:
      - mediaserver-radarr-config:/config
      - ${MEDIA_ROOT}:/data   # stessa root di qBittorrent -> hardlink
    networks:
      - mediaserver-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: mediaserver-sonarr
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "8989:8989"
    volumes:
      - mediaserver-sonarr-config:/config
      - ${MEDIA_ROOT}:/data
    networks:
      - mediaserver-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: mediaserver-bazarr
    restart: unless-stopped
    environment:
      <<: *common-env
    ports:
      - "6767:6767"
    volumes:
      - mediaserver-bazarr-config:/config
      - ${MEDIA_ROOT}:/data
    networks:
      - mediaserver-network

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: mediaserver-homepage
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Obbligatorio in Homepage v1.x: host da cui è ammesso l'accesso
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      # Variabili usate nelle config (services.yaml / widgets.yaml)
      HOMEPAGE_VAR_SERVER_IP: ${SERVER_IP}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${JELLYFIN_API_KEY:-}
      HOMEPAGE_VAR_RADARR_KEY: ${RADARR_API_KEY:-}
      HOMEPAGE_VAR_SONARR_KEY: ${SONARR_API_KEY:-}
      HOMEPAGE_VAR_PROWLARR_KEY: ${PROWLARR_API_KEY:-}
      HOMEPAGE_VAR_BAZARR_KEY: ${BAZARR_API_KEY:-}
      HOMEPAGE_VAR_QBIT_USER: ${QBIT_USER:-admin}
      HOMEPAGE_VAR_QBIT_PASS: ${QBIT_PASS:-}
    # Accesso al socket Docker per i widget di stato container.
    # Metti in DOCKER_GID (.env) il GID del gruppo docker:  getent group docker
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "3000:3000"
    volumes:
      - ./homepage:/app/config
      - ${MEDIA_ROOT}:/data:ro                       # per il widget "spazio disco"
      - /var/run/docker.sock:/var/run/docker.sock:ro # per lo stato dei container
    networks:
      - mediaserver-network

  # Espone lo stato dei backup (scritto da scripts/backup-config.sh) a Homepage.
  backup-status:
    image: nginx:1.31.2-alpine
    container_name: mediaserver-backup-status
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - /var/lib/mediaserver-backup-status:/usr/share/nginx/html:ro
    networks:
      - mediaserver-network

volumes:
  mediaserver-jellyfin-config:
    name: mediaserver-jellyfin-config
  mediaserver-jellyfin-cache:
    name: mediaserver-jellyfin-cache
  mediaserver-qbittorrent-config:
    name: mediaserver-qbittorrent-config
  mediaserver-prowlarr-config:
    name: mediaserver-prowlarr-config
  mediaserver-radarr-config:
    name: mediaserver-radarr-config
  mediaserver-sonarr-config:
    name: mediaserver-sonarr-config
  mediaserver-bazarr-config:
    name: mediaserver-bazarr-config

networks:
  mediaserver-network:
    name: mediaserver-network
    driver: bridge
