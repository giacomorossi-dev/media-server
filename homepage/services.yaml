- Streaming:
    - Jellyfin:
        icon: jellyfin.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8096
        description: Film e serie TV
        server: my-docker
        container: mediaserver-jellyfin
        widget:
          type: jellyfin
          url: http://mediaserver-jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

