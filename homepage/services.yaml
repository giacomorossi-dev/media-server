- Download:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8080
        description: Client torrent
        server: my-docker
        container: mediaserver-qbittorrent
        widget:
          type: qbittorrent
          url: http://mediaserver-qbittorrent:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"
